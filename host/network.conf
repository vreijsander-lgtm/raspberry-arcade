# The arcade's own Wi-Fi network. The host Pi makes it (setup_host.sh), and
# every arcade Pi joins it by itself when it starts (main/join_arcade_wifi.sh).
# Nobody has to type this password anywhere.
#
# Want to change it? Change it here BEFORE you set up the host, push it to GitHub,
# and let the arcade Pis start once with normal internet so they get the change.
# Note: this repository is public, so anyone who reads it can see this password.
# It's only the arcade's network (no school or home computers on it), so that's okay.

ARCADE_SSID="NOVA-ARCADE"
ARCADE_PASSWORD="nova-arcade-play"     # 8 to 63 characters
ARCADE_COUNTRY="NL"                    # your country code (needed for Wi-Fi)
ARCADE_CHANNEL="6"                     # 1, 6 or 11
